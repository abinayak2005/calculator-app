<h1>Simple Calculator</h1>

<div>
  <label>First Number:</label>
  <input
    type="number"
    [(ngModel)]="firstNumber"
    placeholder="Enter first number"
  />
</div>

<br />

<div>
  <label>Second Number:</label>
  <input
    type="number"
    [(ngModel)]="secondNumber"
    placeholder="Enter second number"
  />
</div>

<br />

<button (click)="add()">Add</button>



<h2>Result: {{ result }}</h2>
